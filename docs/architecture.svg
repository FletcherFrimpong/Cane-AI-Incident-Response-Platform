<path d="M960 126 L960 174" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="40" y="526" width="360" height="96" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="60" y="556" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="60" y="580" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">Incidents, log events, actions,</text>
<text x="60" y="599" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">playbooks, timeline. Alembic migrations.</text>
<rect x="420" y="526" width="360" height="96" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="440" y="556" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Redis</text>
<text x="440" y="580" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">Task broker for Celery, and</text>
<text x="440" y="599" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">pub/sub for the live update stream.</text>
<rect x="800" y="526" width="360" height="96" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="820" y="556" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Celery workers</text>
<text x="820" y="580" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">Auto-triage, notifications, ticket sync,</text>
<text x="820" y="599" font-size="12.5" fill="#68737d" font-weight="400" text-anchor="start">source polling, health checks.</text>
