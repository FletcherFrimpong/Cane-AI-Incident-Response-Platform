<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 664" width="1160" height="664" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Cane AI pipeline: from a raw event to a closed incident</title>
<desc id="d">Five automatic stages: ingest, correlate, enrich, AI triage, guard. The guard sends each recommended action to one of three outcomes: the approval queue, automatic execution, or dropped. An analyst decides on queued actions, connected tools carry them out, the playbook moves on, and the incident is closed.</desc>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68737d"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1f73b7"/></marker>
</defs>
<rect width="1160" height="664" rx="14" fill="#ffffff"/>
<rect x="30" y="24" width="1100" height="210" rx="14" fill="#f8f9f9" stroke="#d8dcde" stroke-width="1.25"/>
<text x="52" y="50" font-size="11" fill="#68737d" font-weight="700" text-anchor="start" letter-spacing="0.08em">AUTOMATIC · NO PERSON INVOLVED</text>
<rect x="52" y="66" width="196" height="146" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<circle cx="76" cy="94" r="12" fill="#1f73b7"/>
<text x="76" y="98.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="99" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Ingest</text>
<text x="68" y="130" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Webhook, upload, batch</text>
<text x="68" y="149" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">or polled source.</text>
<text x="68" y="168" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">14 log types normalised.</text>
<path d="M250 139.0 H266" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="268" y="66" width="196" height="146" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<circle cx="292" cy="94" r="12" fill="#1f73b7"/>
<text x="292" y="98.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="312" y="99" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Correlate</text>
<text x="284" y="130" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Events sharing an ID are</text>
<text x="284" y="149" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">grouped. An incident opens</text>
<text x="284" y="168" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">only if it is warranted.</text>
<path d="M466 139.0 H482" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="484" y="66" width="196" height="146" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<circle cx="508" cy="94" r="12" fill="#1f73b7"/>
<text x="508" y="98.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="528" y="99" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Enrich</text>
<text x="500" y="130" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Indicators checked against</text>
<text x="500" y="149" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">threat intelligence; accounts</text>
<text x="500" y="168" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">and hosts looked up.</text>
<path d="M682 139.0 H698" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="700" y="66" width="196" height="146" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<circle cx="724" cy="94" r="12" fill="#1f73b7"/>
<text x="724" y="98.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="744" y="99" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">AI triage</text>
<text x="716" y="130" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Severity, attack type,</text>
<text x="716" y="149" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">MITRE mapping, confidence,</text>
<text x="716" y="168" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">recommended actions.</text>
<path d="M898 139.0 H914" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="916" y="66" width="196" height="146" rx="10" fill="#eef7f9" stroke="#0b3640" stroke-width="2"/>
<circle cx="940" cy="94" r="12" fill="#0b3640"/>
<text x="940" y="98.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="960" y="99" font-size="15" fill="#2f3941" font-weight="700" text-anchor="start">Guard</text>
<text x="932" y="130" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Reply validated. Each action</text>
<text x="932" y="149" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">checked against the</text>
<text x="932" y="168" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">evidence and the allow-list.</text>
<text x="52" y="268" font-size="11" fill="#68737d" font-weight="700" text-anchor="start" letter-spacing="0.08em">FOR EACH RECOMMENDED ACTION, THE GUARD PICKS ONE OUTCOME</text>
<rect x="52" y="300" width="330" height="112" rx="10" fill="#fff8ed" stroke="#d8dcde" stroke-width="1.25"/>
<rect x="52" y="300" width="6" height="112" rx="3" fill="#c2780c"/>
<text x="74" y="330" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Approval queue</text>
<text x="74" y="354.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Everything else: isolate a host,</text>
<text x="74" y="372.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">disable an account, revoke sessions,</text>
<text x="74" y="391.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">remove an email. Waits for a person.</text>
<rect x="406" y="300" width="330" height="112" rx="10" fill="#edf8f4" stroke="#d8dcde" stroke-width="1.25"/>
<rect x="406" y="300" width="6" height="112" rx="3" fill="#038153"/>
<text x="428" y="330" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Runs automatically</text>
<text x="428" y="354.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Only a block of an IP, URL or file hash,</text>
<text x="428" y="372.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">with confidence at or above 0.95 and</text>
<text x="428" y="391.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">no request for human review.</text>
<rect x="760" y="300" width="330" height="112" rx="10" fill="#f3f4f5" stroke="#d8dcde" stroke-width="1.25"/>
<rect x="760" y="300" width="6" height="112" rx="3" fill="#87929d"/>
<text x="782" y="330" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Dropped, and recorded</text>
<text x="782" y="354.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Not an action the AI may propose, or</text>
<text x="782" y="372.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">its target does not appear in the</text>
<text x="782" y="391.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">incident's own evidence.</text>
<path d="M1014.0 212 V282 H217.0" fill="none" stroke="#68737d" stroke-width="1.6"/>
<path d="M217.0 282 V298" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#g)"/>
<path d="M571.0 282 V298" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#g)"/>
<path d="M925.0 282 V298" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="30" y="452" width="1100" height="186" rx="14" fill="#f8f9f9" stroke="#d8dcde" stroke-width="1.25"/>
<text x="1108" y="478" font-size="11" fill="#68737d" font-weight="700" text-anchor="end" letter-spacing="0.08em">WITH AN ANALYST · TIER 2 OR ABOVE APPROVES</text>
<rect x="52" y="494" width="250" height="124" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="70" y="524" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Analyst decides</text>
<text x="70" y="550.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Reviews the AI analysis, evidence</text>
<text x="70" y="568.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">and threat intel on the incident</text>
<text x="70" y="587.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">page, then approves or rejects.</text>
<path d="M304 556.0 H322" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="324" y="494" width="250" height="124" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="342" y="524" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Connected tools act</text>
<text x="342" y="550.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">The action goes to every connected</text>
<text x="342" y="568.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">tool that supports it. Integrations</text>
<text x="342" y="587.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">in dry-run only simulate.</text>
<path d="M576 556.0 H594" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="596" y="494" width="250" height="124" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="614" y="524" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Playbook moves on</text>
<text x="614" y="550.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Finished actions advance the NIST</text>
<text x="614" y="568.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">800-61 playbook; its next automated</text>
<text x="614" y="587.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">step proposes more for approval.</text>
<path d="M848 556.0 H866" fill="none" stroke="#1f73b7" stroke-width="1.6" marker-end="url(#b)"/>
<rect x="868" y="494" width="250" height="124" rx="10" fill="#ffffff" stroke="#d8dcde" stroke-width="1.25"/>
<text x="886" y="524" font-size="14.5" fill="#2f3941" font-weight="700" text-anchor="start">Incident closed</text>
<text x="886" y="550.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">Resolution recorded on the timeline.</text>
<text x="886" y="568.5" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">The ticket is closed and the page</text>
<text x="886" y="587.0" font-size="12.2" fill="#68737d" font-weight="400" text-anchor="start">is resolved.</text>
<path d="M177.0 412 V492" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#g)"/>
<path d="M501.0 412 V492" fill="none" stroke="#68737d" stroke-width="1.6" marker-end="url(#g)"/>
</svg>